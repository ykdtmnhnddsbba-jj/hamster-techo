<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ハムスター手帖 — 部屋掃除・大掃除の記録と次回日</title>
<style>
:root{
  --bg:#12141c;--panel:#1b1e2a;--panel2:#252938;--line:#2f3447;--text:#ecedf3;--sub:#9da2b8;
  --room:#a3e635;--big:#fbbf24;--ok:#5eead4;--warn:#fbbf24;--bad:#ff8fa3;--radius:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(18,20,28,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;letter-spacing:.04em}
.logo b{color:var(--room)}
nav{display:flex;gap:4px;flex:1;flex-wrap:nowrap}
nav button{background:none;border:0;padding:8px 14px;border-radius:999px;color:var(--sub);cursor:pointer;font-weight:600;white-space:nowrap}
@media(max-width:600px){.bar{gap:6px 10px}.logo{order:1}#syncChip{order:2;margin-left:auto}nav{order:3;flex-basis:100%;overflow-x:auto}nav button{padding:8px 12px}}
a.btn{color:inherit}
nav button.on{background:var(--panel2);color:var(--text)}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--sub);cursor:pointer}
.chip.ok{color:var(--ok);border-color:#2a5b55}
.chip.bad{color:var(--warn);border-color:#6b5a1c}
main{max-width:900px;margin:0 auto;padding:18px 16px 80px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block;font-size:14px}
.btn:hover{border-color:var(--sub)}
.btn.pri{background:var(--k,var(--room));border-color:var(--k,var(--room));color:#10130a}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:700px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--k);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.card h2{margin:0;font-size:17px;display:flex;justify-content:space-between;align-items:baseline}
.card h2 small{font-size:12px;color:var(--sub);font-weight:400}
.big{font-size:32px;font-weight:800;line-height:1.2}
.big.late{color:var(--bad)}.big.today{color:var(--k)}
.bar2{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:4px 0 8px}
.bar2 i{display:block;height:100%;background:var(--k)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--sub);font-size:14px}
.row b{color:var(--text);font-weight:600}
.badge{font-size:11px;padding:1px 8px;border-radius:999px;margin-left:6px;border:1px solid var(--line)}
.badge.auto{color:var(--ok);border-color:#2a5b55}.badge.man{color:var(--warn);border-color:#6b5a1c}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.acts .btn.pri{flex:1;text-align:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
.panel h2{margin:0 0 8px;font-size:16px}
.hint{color:var(--sub);font-size:13px;margin:4px 0}
.field{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field input,.field select,.mform input,.mform textarea,.mform select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.field input[type=number]{width:80px}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .d{font-weight:700;min-width:110px}
.list .m{flex:1;color:var(--sub);font-size:14px;overflow-wrap:anywhere}
.tag{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--k);color:var(--k);white-space:nowrap}
.k-room{--k:var(--room)}.k-big{--k:var(--big)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:12px;color:var(--sub);padding:4px 0}
.cal .c{min-height:58px;border-radius:10px;background:var(--panel2);padding:4px 0;cursor:pointer;font-size:14px;border:1px solid transparent}
.cal .c.o{background:transparent;cursor:default}
.cal .c.t{border-color:var(--sub)}
.cal .c.sun{color:var(--bad)}.cal .c.sat{color:#7cc4ff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin:1px;background:var(--k);box-sizing:border-box}
.dot.p{background:transparent;border:2px solid var(--k)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:10px}
.mnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;width:100%;max-width:380px}
.mbox h3{margin:0 0 10px}
.mform{display:flex;flex-direction:column;gap:10px}
.mform label{font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:4px}
.mform .acts{margin-top:4px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;display:none;z-index:60;max-width:90vw}
.empty{color:var(--sub);text-align:center;padding:24px 0}
</style>
</head>
<body>
<header><div class="bar"><div class="logo">ハムスター<b>手帖</b></div><nav id="nav"></nav><button class="chip" id="syncChip"></button></div></header>
<main id="main"></main>
<div id="modal"></div>
<div id="toast"></div>
<script>
const VERSION='v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS_DB='hamsterdb.v1',LS_SET='hamsterdb.settings.v1';
const lsGet=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/86400000);
const WD=['日','月','火','水','木','金','土'];
const fmtJ=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）'};
const fmtFull=s=>{const d=parse(s);return d.getFullYear()+'/'+fmtJ(s)};
const today=()=>ymd(new Date());
const nowIso=()=>new Date().toISOString();
const NAME={room:'こめちの家の掃除',big:'こめちの家の大掃除'};
const DEF_CFG={room_days:7,big_nth:1,big_weekday:4,room_time:'',big_time:'',cal_minutes:60,big_counts_as_room:true,updated_at:'2000-01-01T00:00:00.000Z'};
const nthWeekday=(y,m,nth,wd)=>{const f=new Date(y,m,1,12).getDay();return ymd(new Date(y,m,1+((wd-f+7)%7)+7*(nth-1),12))};
const addMinutes=(date,time,min)=>{const [h,m]=time.split(':').map(Number);const d=parse(date);d.setHours(h,m+min,0,0);return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':00'};

/* ---------- データ ---------- */
let settings=Object.assign({google_client_id:'',drive_linked:false},lsGet(LS_SET,{}));
const DEFAULT_CLIENT_ID='568813131190-9pb3hf0f3g3rbiglkq4nbk88g4eltk9p.apps.googleusercontent.com';
if(!settings.google_client_id)settings.google_client_id=DEFAULT_CLIENT_ID;
const saveSettings=()=>lsSet(LS_SET,settings);
let db=lsGet(LS_DB,null);
if(!db){
  db={schema_version:1,events:{},next_override:{},config:{...DEF_CFG},cal_events:{}};
  db.events['seed-room']={id:'seed-room',type:'room',date:'2026-11-12',time:'',memo:'初期値',updated_at:'2026-11-12T00:00:00.000Z'};
  db.events['seed-big']={id:'seed-big',type:'big',date:'2026-11-02',time:'',memo:'初期値',updated_at:'2026-11-12T00:00:00.000Z'};
  db.cal_events.room={date:'2026-11-19',time:'',event_id:'lq0mitnj7g0gu5kn0phbf0jf84',updated_at:'2026-11-12T00:00:00.000Z'};
  db.cal_events.big={date:'2026-12-03',time:'',event_id:'j3jv6mlnrv8qj9mg3icmnj4brk',updated_at:'2026-11-12T00:00:00.000Z'};
  lsSet(LS_DB,db);
}
db.config={...DEF_CFG,...db.config};db.cal_events=db.cal_events||{};
const saveLocal=()=>lsSet(LS_DB,db);
function changed(){saveLocal();scheduleSync();render()}
const uid=()=>'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function liveEvents(){return Object.values(db.events).filter(e=>!e.deleted).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.updated_at<b.updated_at?1:-1))}
function lastEv(kind){
  const types=(kind==='room'&&db.config.big_counts_as_room)?['room','big']:[kind];
  return liveEvents().find(e=>types.includes(e.type))||null;
}
function lastDone(kind){const e=lastEv(kind);return e?e.date:null}
const evTime=k=>{const e=lastEv(k);return e&&e.time?' '+e.time:''};
function nextInfo(kind){
  const c=db.config,last=lastDone(kind);
  let auto=null;
  if(last){if(kind==='room')auto=addDays(last,c.room_days);else{const d=parse(last);auto=nthWeekday(d.getFullYear(),d.getMonth()+1,c.big_nth,c.big_weekday)}}
  const ov=db.next_override[kind];
  const manual=ov&&ov.date&&(!last||ov.date>last)?ov:null;
  const next=manual?manual.date:auto;
  return {last,auto,next,manual:!!manual,time:manual?(manual.time||''):(c[kind+'_time']||''),
    span:last&&next?Math.max(1,diffDays(next,last)):1,
    rule:kind==='room'?c.room_days+'日ごと':'毎月 第'+c.big_nth+WD[c.big_weekday]+'曜日'};
}
function clearOverrides(type){
  const kinds=type==='big'&&db.config.big_counts_as_room?['room','big']:[type];
  kinds.forEach(k=>{if(db.next_override[k]&&db.next_override[k].date)db.next_override[k]={date:null,updated_at:nowIso()}});
}
function addEvent(type,date,memo,time){
  const id=uid();db.events[id]={id,type,date,time:time||'',memo:memo||'',updated_at:nowIso()};
  clearOverrides(type);changed();
}
function setOverride(kind,date,time){db.next_override[kind]={date:date||null,time:time||'',updated_at:nowIso()};changed()}

function mergeDb(a,b){
  const out={schema_version:1,events:{...a.events},next_override:{...a.next_override},config:a.config,cal_events:{...(a.cal_events||{})}};
  for(const [k,o] of Object.entries(b.cal_events||{})){const x=out.cal_events[k];if(!x||(o.updated_at||'')>(x.updated_at||''))out.cal_events[k]=o}
  for(const [id,e] of Object.entries(b.events||{})){const x=out.events[id];if(!x||(e.updated_at||'')>(x.updated_at||''))out.events[id]=e}
  for(const [k,o] of Object.entries(b.next_override||{})){const x=out.next_override[k];if(!x||(o.updated_at||'')>(x.updated_at||''))out.next_override[k]=o}
  if(b.config&&(b.config.updated_at||'')>(a.config.updated_at||''))out.config={...DEF_CFG,...b.config};
  return out;
}
const exportObj=()=>({_readme:'ハムスター手帖のデータ。events=掃除の記録、next_override=次回日の手動修正、config=周期など',...db});

/* ---------- Google Drive 同期（他の手帖と同じ方式） ---------- */
const DRIVE_NAME='hamster-db.json';
let gToken=null,gExp=0,driveFileId=null,syncState=settings.drive_linked?'need':'off',syncTimer=null,syncing=false;
const G_SCOPE='https://www.googleapis.com/auth/drive.file';
const G_REDIR=location.origin+location.pathname.replace(/index\.html$/,'');
const G_TOKKEY='gauth_tok:'+G_REDIR;
(function(){
  try{
    if(/access_token=|error=/.test(location.hash)){
      const p=new URLSearchParams(location.hash.slice(1));
      if(p.get('state')&&p.get('state')===sessionStorage.getItem('gauth_state')){
        if(p.get('access_token'))sessionStorage.setItem(G_TOKKEY,JSON.stringify({t:p.get('access_token'),e:Date.now()+(+p.get('expires_in')||3600)*1000}));
        sessionStorage.removeItem('gauth_state');
        history.replaceState(null,'',location.pathname+location.search);
      }
    }
    const s=JSON.parse(sessionStorage.getItem(G_TOKKEY)||'null');
    if(s&&s.e>Date.now()){gToken=s.t;gExp=s.e}
  }catch(e){}
})();
const CAL_SCOPE='https://www.googleapis.com/auth/calendar.events';
function gRedirect(prompt,scope){
  const st=Math.random().toString(36).slice(2)+Date.now().toString(36);
  try{sessionStorage.setItem('gauth_state',st)}catch(e){}
  const q=new URLSearchParams({client_id:settings.google_client_id.trim(),redirect_uri:G_REDIR,response_type:'token',scope:scope||G_SCOPE,state:st,include_granted_scopes:'true'});
  if(prompt)q.set('prompt',prompt);
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+q.toString();
  return new Promise(()=>{});
}
async function driveAuth(interactive){
  if(!settings.google_client_id.trim())throw new Error('Google クライアントIDが未設定です（設定タブ）');
  if(interactive)return gRedirect('');
  throw new Error('再接続が必要です');
}
function gStartup(){
  if(!settings.google_client_id)return;
  if(gToken){driveSync(false);return}
  if(!settings.drive_linked)return;
  let last=0;try{last=+sessionStorage.getItem('gauth_silent')||0}catch(e){}
  if(Date.now()-last<300000){setSync('need');return}
  try{sessionStorage.setItem('gauth_silent',String(Date.now()))}catch(e){}
  gRedirect('none');
}
window.addEventListener('pageshow',e=>{if(e.persisted){syncing=false;setSync('need')}});
const gFetch=(url,opt={})=>fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+gToken}});
async function driveSync(interactive){
  if(syncing)return;syncing=true;setSync('busy');
  try{
    if(!gToken||Date.now()>gExp-60000)await driveAuth(interactive);
    let id=driveFileId;
    if(!id){
      const q=encodeURIComponent(`name='${DRIVE_NAME}' and trashed=false`);
      const r=await gFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&orderBy=${encodeURIComponent('modifiedTime desc')}&pageSize=1`);
      if(!r.ok)throw new Error('Drive検索に失敗 ('+r.status+')。Drive APIが有効か確認してください');
      const j=await r.json();id=j.files&&j.files[0]&&j.files[0].id;
    }
    if(id){
      const r=await gFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
      if(r.ok){const remote=await r.json();db=mergeDb(db,remote);saveLocal();render()}
    }
    const body=JSON.stringify(exportObj(),null,1);
    if(id){
      const r=await gFetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});
      if(!r.ok)throw new Error('Drive保存に失敗 ('+r.status+')');
    }else{
      const b='hamsterdb'+Date.now();
      const meta=JSON.stringify({name:DRIVE_NAME,mimeType:'application/json'});
      const mp=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${body}\r\n--${b}--`;
      const r=await gFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:mp});
      if(!r.ok)throw new Error('Drive作成に失敗 ('+r.status+')');
      id=(await r.json()).id;
    }
    driveFileId=id;settings.drive_linked=true;saveSettings();setSync('ok');return true;
  }catch(e){setSync(interactive?'bad':'need');if(interactive)toast(e.message,5000);console.warn(e);return false}
  finally{syncing=false}
}
function scheduleSync(){
  if(!settings.drive_linked)return;
  setSync('dirty');clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{if(gToken&&Date.now()<gExp-60000)driveSync(false);else setSync('need')},2500);
}
function setSync(s){
  syncState=s;const c=$('#syncChip');
  const map={off:['☁ Drive未連携',''],need:['☁ 要再接続（クリック）','bad'],ok:['☁ 同期済み','ok'],dirty:['☁ 未同期…','bad'],busy:['☁ 同期中…',''],bad:['☁ 同期エラー（クリック）','bad']};
  const [t,cls]=map[s]||map.off;c.textContent=t;c.className='chip '+cls;
}
$('#syncChip').onclick=()=>{if(!settings.google_client_id){ui.tab='settings';render();return}driveSync(true)};

/* ---------- UI ---------- */
let toastT;
function toast(t,ms=2500){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',ms)}
const ui={tab:'home',month:today().slice(0,7)};
const TABS=[['home','ホーム'],['history','履歴'],['cal','カレンダー'],['settings','設定']];
function renderNav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${ui.tab===k?'on':''}">${l}</button>`).join('')}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;ui.tab=b.dataset.tab;render()};
function render(){
  renderNav();const m=$('#main');
  if(ui.tab==='home')renderHome(m);else if(ui.tab==='history')renderHistory(m);else if(ui.tab==='cal')renderCal(m);else renderSettings(m);
}
/* ---------- Googleカレンダー自動登録 ---------- */
const CAL_API='https://www.googleapis.com/calendar/v3/calendars/primary/events';
function calBody(kind,n){
  const base={summary:NAME[kind],description:'ハムスター手帖から登録',transparency:'transparent'};
  if(n.time){
    return {...base,start:{dateTime:n.next+'T'+n.time+':00',timeZone:'Asia/Tokyo',date:null},end:{dateTime:addMinutes(n.next,n.time,db.config.cal_minutes||60),timeZone:'Asia/Tokyo',date:null}};
  }
  return {...base,start:{date:n.next,dateTime:null,timeZone:null},end:{date:addDays(n.next,1),dateTime:null,timeZone:null}};
}
function calConsent(kind){
  let last=0;try{last=+sessionStorage.getItem('gcal_try')||0}catch(e){}
  if(Date.now()-last<120000){toast('Googleカレンダーの許可が得られませんでした。もう一度お試しください',5000);return}
  try{sessionStorage.setItem('gcal_try',String(Date.now()));sessionStorage.setItem('pending_cal',kind)}catch(e){}
  gRedirect('consent',G_SCOPE+' '+CAL_SCOPE);
}
let calBusy=false;
async function registerCalendar(kind){
  if(calBusy)return;
  const n=nextInfo(kind);if(!n.next){toast('次回日がありません');return}
  const prev=db.cal_events[kind];
  if(prev&&prev.date===n.next&&(prev.time||'')===n.time&&prev.event_id){toast('登録済みです');return}
  if(!gToken||Date.now()>gExp-60000){try{sessionStorage.setItem('pending_cal',kind)}catch(e){}return gRedirect('',G_SCOPE+' '+CAL_SCOPE)}
  calBusy=true;
  try{
    const headers={'Content-Type':'application/json'},body=JSON.stringify(calBody(kind,n));
    let r=null,id=prev&&prev.event_id;
    if(id){r=await gFetch(CAL_API+'/'+id,{method:'PATCH',headers,body});if(r.status===404||r.status===410){id=null;r=null}}
    if(!id)r=await gFetch(CAL_API,{method:'POST',headers,body});
    if(!r.ok){
      const t=await r.text();
      if(r.status===401||(r.status===403&&/scope|insufficient/i.test(t))){calBusy=false;return calConsent(kind)}
      if(r.status===403&&/not been used|disabled|accessNotConfigured/i.test(t))throw new Error('Google Calendar API が有効になっていません。Google Cloud で有効にしてください');
      throw new Error('カレンダー登録に失敗しました ('+r.status+')');
    }
    const j=await r.json();
    db.cal_events[kind]={date:n.next,time:n.time,event_id:j.id,updated_at:nowIso()};
    changed();toast(NAME[kind]+'を'+fmtJ(n.next)+(n.time?' '+n.time:'')+'で登録しました');
  }catch(e){toast(e.message,6000);console.warn(e)}
  finally{calBusy=false}
}
function renderHome(m){
  const t=today();
  m.innerHTML=`<div class="hint" style="margin-bottom:10px">今日 ${fmtFull(t)}</div><div class="cards">`+['room','big'].map(k=>{
    const n=nextInfo(k);
    if(!n.last)return `<div class="card k-${k}"><h2>${NAME[k]}</h2><div class="hint">まだ記録がありません。</div><div class="acts"><button class="btn pri" data-do="${k}">やった</button></div></div>`;
    const rem=diffDays(n.next,t),el=Math.max(0,Math.min(1,diffDays(t,n.last)/n.span));
    const big=rem>0?`あと${rem}日`:rem===0?'今日':`${-rem}日超過`;
    const cls=rem<0?'late':rem===0?'today':'';
    const cal=db.cal_events[k],reg=cal&&cal.event_id&&cal.date===n.next&&(cal.time||'')===n.time;
    return `<div class="card k-${k}"><h2>${NAME[k]}<small>${n.rule}</small></h2>
      <div class="big ${cls}">${big}</div><div class="bar2"><i style="width:${Math.round(el*100)}%"></i></div>
      <div class="row">前回<b>${fmtJ(n.last)}${evTime(k)}</b></div>
      <div class="row">次回<span><b>${fmtJ(n.next)}${n.time?' '+n.time:''}</b><span class="badge ${n.manual?'man':'auto'}">${n.manual?'手動':'自動'}</span></span></div>
      <div class="acts"><button class="btn pri" data-do="${k}">やった</button><button class="btn" data-edit="${k}">次回日を直す</button><button class="btn" data-cal="${k}">${reg?'カレンダー登録済み':'カレンダーに登録'}</button></div></div>`;
  }).join('')+`</div>`;
}
function renderHistory(m){
  const ev=liveEvents();
  m.innerHTML=`<div class="panel"><h2>履歴</h2><div class="acts" style="margin:0 0 8px"><button class="btn pri" data-do="room">部屋の掃除を記録</button><button class="btn" style="--k:var(--big)" data-do="big">大掃除を記録</button></div>
  <div class="list">${ev.length?ev.map(e=>`<div class="it"><span class="d">${fmtFull(e.date)}${e.time?' '+e.time:''}</span><span class="tag k-${e.type}">${NAME[e.type]}</span><span class="m">${esc(e.memo)}</span><button class="btn sm" data-ed="${e.id}">編集</button></div>`).join(''):'<div class="empty">まだ記録がありません。</div>'}</div></div>`;
}
function renderCal(m){
  const [y,mo]=ui.month.split('-').map(Number);
  const first=new Date(y,mo-1,1,12),last=new Date(y,mo,0,12);
  const marks={};
  liveEvents().forEach(e=>{(marks[e.date]=marks[e.date]||[]).push([e.type,false])});
  ['room','big'].forEach(k=>{const n=nextInfo(k);if(n.next)(marks[n.next]=marks[n.next]||[]).push([k,true])});
  let cells=WD.map(w=>`<div class="h">${w}</div>`).join('');
  for(let i=0;i<first.getDay();i++)cells+='<div class="c o"></div>';
  for(let d=1;d<=last.getDate();d++){
    const s=y+'-'+pad(mo)+'-'+pad(d),wd=new Date(y,mo-1,d).getDay();
    cells+=`<div class="c ${s===today()?'t':''} ${wd===0?'sun':wd===6?'sat':''}" data-date="${s}">${d}<br>${(marks[s]||[]).map(([k,p])=>`<span class="dot k-${k} ${p?'p':''}"></span>`).join('')}</div>`;
  }
  m.innerHTML=`<div class="panel"><div class="mnav"><button class="btn sm" id="pm">◀</button><b>${y}年${mo}月</b><button class="btn sm" id="nm">▶</button></div><div class="cal">${cells}</div>
  <div class="legend"><span><span class="dot k-room"></span>部屋掃除（済）</span><span><span class="dot k-room p"></span>部屋掃除（予定）</span><span><span class="dot k-big"></span>大掃除（済）</span><span><span class="dot k-big p"></span>大掃除（予定）</span></div>
  <div class="hint">日付をタップすると、その日に掃除した記録を追加できます。</div></div>`;
  const shift=n=>{const d=new Date(y,mo-1+n,1);ui.month=d.getFullYear()+'-'+pad(d.getMonth()+1);render()};
  $('#pm').onclick=()=>shift(-1);$('#nm').onclick=()=>shift(1);
}
function renderSettings(m){
  const c=db.config;
  m.innerHTML=`<div class="panel"><h2>周期</h2>
  <div class="field"><span>${NAME.room}（日ごと）</span><input type="number" min="1" max="365" id="cr" value="${c.room_days}"></div>
  <div class="field"><span>${NAME.big}（毎月）</span><span style="display:flex;gap:6px"><select id="cn">${[1,2,3,4].map(i=>`<option value="${i}" ${c.big_nth===i?'selected':''}>第${i}</option>`).join('')}</select><select id="cw">${WD.map((w,i)=>`<option value="${i}" ${c.big_weekday===i?'selected':''}>${w}曜日</option>`).join('')}</select></span></div>
  <div class="field"><span>大掃除の日は部屋の掃除も済みにする</span><input type="checkbox" id="cc" ${c.big_counts_as_room?'checked':''}></div>
  <p class="hint">${NAME.room}の次回日は「前回の日付＋周期」、${NAME.big}は「前回の翌月の第◯◯曜日」で自動計算します。ホームの「次回日を直す」で手動に変えられます。掃除を記録すると自動に戻ります。</p></div>
  <div class="panel"><h2>時間</h2>
  <div class="field"><span>${NAME.room}の時間</span><input type="time" id="tr" value="${c.room_time}"></div>
  <div class="field"><span>${NAME.big}の時間</span><input type="time" id="tb" value="${c.big_time}"></div>
  <div class="field"><span>カレンダー予定の長さ（分）</span><input type="number" min="5" max="600" step="5" id="cm" value="${c.cal_minutes}"></div>
  <p class="hint">時間を入れると、カレンダーに時刻つきで登録します。空欄なら終日の予定です。掃除の記録や次回日を直すときに、1回ごとの時間も入力できます。</p></div>
  <div class="panel"><h2>☁ Google Drive 同期</h2>
  <p class="hint">記録を Drive の <code>${DRIVE_NAME}</code> に自動保存します（このアプリが作ったファイルだけにアクセスする権限）。スマホとPCで同じデータを使えます。</p>
  <div class="field"><span>Google OAuth クライアントID</span><input id="gcid" style="flex:1;min-width:0" value="${esc(settings.google_client_id)}"></div>
  <div class="acts"><button class="btn pri" id="gConnect">${settings.drive_linked?'今すぐ同期':'Driveに接続'}</button>${settings.drive_linked?'<button class="btn danger" id="gOff">連携を解除</button>':''}</div></div>
  <div class="panel"><h2>データ</h2><div class="acts" style="margin:0"><button class="btn" id="exp">JSONを書き出す</button><label class="btn">JSONを読み込む<input type="file" id="imp" accept=".json" hidden></label></div><p class="hint">バージョン ${VERSION}</p></div>`;
  const save=()=>{db.config={...db.config,room_days:Math.max(1,+$('#cr').value||7),big_nth:+$('#cn').value||1,big_weekday:+$('#cw').value,room_time:$('#tr').value,big_time:$('#tb').value,cal_minutes:Math.max(5,+$('#cm').value||60),big_counts_as_room:$('#cc').checked,updated_at:nowIso()};changed()};
  ['#cr','#cn','#cw','#cc','#tr','#tb','#cm'].forEach(s=>$(s).onchange=save);
  $('#gConnect').onclick=async()=>{settings.google_client_id=$('#gcid').value.trim();saveSettings();if(await driveSync(true))toast('Driveと同期しました')};
  const off=$('#gOff');if(off)off.onclick=()=>{settings.drive_linked=false;saveSettings();gToken=null;driveFileId=null;setSync('off');renderSettings(m)};
  $('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(exportObj(),null,1)],{type:'application/json'}));a.download='hamster-db.json';a.click()};
  $('#imp').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());db=mergeDb(db,j);changed();toast('読み込みました')}catch(x){toast('読み込めませんでした')}};
}

/* ---------- ダイアログ ---------- */
function openModal(html,onSubmit){
  const md=$('#modal');md.innerHTML=`<div class="mbox">${html}</div>`;md.classList.add('on');
  const f=md.querySelector('form');
  md.querySelector('[data-close]').onclick=closeModal;
  f.onsubmit=e=>{e.preventDefault();const r=onSubmit(new FormData(f),e.submitter&&e.submitter.value);if(r!==false)closeModal()};
}
function closeModal(){$('#modal').classList.remove('on');$('#modal').innerHTML=''}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function doDialog(kind,date){
  openModal(`<h3>${NAME[kind]}を記録</h3><form class="mform"><label>やった日<input type="date" name="date" value="${date||today()}" required></label><label>時間（任意）<input type="time" name="time" value="${db.config[kind+'_time']||''}"></label><label>メモ（任意）<input type="text" name="memo" placeholder="回し車を洗った"></label><div class="acts"><button type="button" class="btn" data-close>やめる</button><button class="btn pri k-${kind}" style="flex:1">記録する</button></div></form>`,
  fd=>{addEvent(kind,fd.get('date'),fd.get('memo'),fd.get('time'));toast(NAME[kind]+'を記録しました')});
}
function editNextDialog(kind){
  const n=nextInfo(kind);
  openModal(`<h3>${NAME[kind]}の次回日を直す</h3><form class="mform"><div class="hint">自動計算：${n.auto?fmtJ(n.auto):'—'}（前回${n.last?fmtJ(n.last):'—'}／${n.rule}）</div><label>次回の日付<input type="date" name="date" value="${n.next||today()}" required></label><label>時間（任意）<input type="time" name="time" value="${n.time}"></label><div class="hint">手動の日付が自動計算より優先されます。掃除を記録すると自動に戻ります。</div><div class="acts"><button type="button" class="btn" data-close>やめる</button><button type="submit" class="btn" value="auto">自動計算に戻す</button><button class="btn pri k-${kind}" value="save">保存</button></div></form>`,
  (fd,v)=>{if(v==='auto')setOverride(kind,null);else setOverride(kind,fd.get('date'),fd.get('time'))});
}
function editEventDialog(id){
  const e=db.events[id];if(!e)return;
  openModal(`<h3>記録を編集</h3><form class="mform"><label>種類<select name="type"><option value="room" ${e.type==='room'?'selected':''}>部屋の掃除</option><option value="big" ${e.type==='big'?'selected':''}>大掃除</option></select></label><label>日付<input type="date" name="date" value="${e.date}" required></label><label>時間（任意）<input type="time" name="time" value="${e.time||''}"></label><label>メモ<input type="text" name="memo" value="${esc(e.memo)}"></label><div class="acts"><button type="button" class="btn" data-close>やめる</button><button type="submit" class="btn danger" value="del">削除</button><button class="btn pri" value="save">保存</button></div></form>`,
  (fd,v)=>{
    if(v==='del'){db.events[id]={...e,deleted:true,updated_at:nowIso()}}
    else db.events[id]={...e,type:fd.get('type'),date:fd.get('date'),time:fd.get('time')||'',memo:fd.get('memo'),updated_at:nowIso()};
    changed();
  });
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-do],[data-edit],[data-ed],[data-cal],.cal .c[data-date]');if(!b)return;
  if(b.dataset.cal)registerCalendar(b.dataset.cal);
  else if(b.dataset.do)doDialog(b.dataset.do);
  else if(b.dataset.edit)editNextDialog(b.dataset.edit);
  else if(b.dataset.ed)editEventDialog(b.dataset.ed);
  else if(b.dataset.date)doDialog('room',b.dataset.date);
});

setSync(syncState);render();
let pendingCal=null;try{pendingCal=sessionStorage.getItem('pending_cal');sessionStorage.removeItem('pending_cal')}catch(e){}
gStartup();
if(pendingCal&&gToken)registerCalendar(pendingCal);
</script>
</body>
</html>
